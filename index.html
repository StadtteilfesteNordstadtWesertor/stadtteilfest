<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einladung zum Tischtennisturnier und Nachbarschaftsgrillen</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #e7b7d8;
    --pink-dark: #d89bc6;
    --ink: #111111;
    --white: rgba(255,255,255,0.9);
    --panel: rgba(255,255,255,0.76);
    --shadow: rgba(0,0,0,0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    color: var(--ink);
    background: #e9e1e7;
  }
  .app {
    min-height: 100vh;
    background-image:
      linear-gradient(rgba(255,255,255,0.03), rgba(255,255,255,0.03)),
      url('data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAA[...]');
    background-position: center top;
    background-size: cover;
    padding: 10px;
  }
  .frame {
    min-height: calc(100vh - 20px);
    border: 6px solid rgba(255,255,255,0.85);
    position: relative;
    overflow: hidden;
  }
  .screen {
    min-height: calc(100vh - 32px);
    padding: 18px 14px 24px;
  }
  .hidden { display: none; }

  .hero-center {
    min-height: calc(100vh - 68px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 14px;
    padding: 12px;
  }
  .eyebrow {
    font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
    letter-spacing: 0.35em;
    font-size: clamp(24px, 5vw, 36px);
    line-height: 1.1;
    font-weight: 700;
    text-align: center;
  }
  .headline-img {
    width: min(92%, 760px);
    display: block;
    margin: 0 auto;
  }
  .place {
    font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.28em;
    font-size: clamp(26px, 7vw, 52px);
    line-height: 1;
    color: var(--pink);
    text-shadow:
      -2px -2px 0 #000,
      2px -2px 0 #000,
      -2px 2px 0 #000,
      2px 2px 0 #000,
      0 5px 0 #000;
  }
  .subline {
    font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
    letter-spacing: 0.18em;
    font-size: clamp(18px, 4vw, 28px);
    line-height: 1.2;
    margin-bottom: 8px;
  }
  .pick-text {
    font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
    font-size: clamp(18px, 4.4vw, 28px);
    line-height: 1.25;
    background: rgba(255,255,255,0.65);
    padding: 10px 16px;
    border-radius: 18px;
  }
  .buttons {
    width: min(100%, 440px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 4px;
  }
  .lang-btn {
    border: 0;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--pink) 0%, var(--pink-dark) 100%);
    color: #111;
    padding: 14px 12px;
    font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
    font-size: 22px;
    font-weight: 700;
    box-shadow: 0 8px 18px var(--shadow);
    cursor: pointer;
  }
  .lang-btn:active {
    transform: translateY(1px);
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .back-btn, .select-wrap select {
    border: 0;
    border-radius: 999px;
    background: rgba(255,255,255,0.92);
    color: #111;
    padding: 11px 14px;
    font-size: 16px;
    font-weight: 700;
    box-shadow: 0 5px 14px rgba(0,0,0,0.08);
  }
  .back-btn {
    font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
    cursor: pointer;
  }
  .select-wrap select {
    appearance: none;
    font-family: Arial, Helvetica, sans-serif;
  }

  .detail-hero {
    text-align: center;
    padding: 6px 4px 2px;
  }
  .detail-hero .headline-img {
    width: min(94%, 700px);
  }
  .detail-hero .place {
    margin-top: 10px;
  }
  .panel {
    max-width: 840px;
    margin: 14px auto 18px;
    background: var(--panel);
    padding: 16px 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.05);
  }
  .intro {
    margin: 0 0 10px;
    font-size: clamp(21px, 4.8vw, 30px);
    line-height: 1.25;
    font-weight: 800;
    font-family: 'Patrick Hand', cursive;
  }
  .copy {
font-family: 'Patrick Hand', cursive;
font-size: clamp(20px,4vw,28px);
line-height: 1.35;
}
  [dir="rtl"] .copy,
[dir="rtl"] .intro,
[dir="rtl"] .strip,
[dir="rtl"] .fact,
[dir="rtl"] button {
  font-family: 'Noto Naskh Arabic', serif;
}
  [dir="rtl"] .copy,
[dir="rtl"] .intro {
  text-align: right;
}
  [dir="rtl"] .copy {
  line-height: 1.6;
}
  
  .copy p {
    margin: 0 0 10px;
  }
  .tile-insert { margin-top: 8px; padding: 10px; background: rgba(255,255,255,0.85); border-radius: 8px; }
  .strip {
    text-align: center;
    font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
    font-size: clamp(24px, 5.8vw, 42px);
    line-height: 1.2;
    margin: 10px 0 12px;
    font-weight: 700;
  }
  .symbols {
    width: min(100%, 760px);
    display: block;
    margin: 0 auto 10px;
  }
  .facts {
    max-width: 860px;
    margin: 12px auto 0;
    display: grid;
    grid-template-columns: 1fr;
    gap: 4px;
  }
  .fact {
    text-align: center;
    font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
    font-size: clamp(22px, 4.8vw, 32px);
    line-height: 1.15;
    letter-spacing: 0.14em;
    font-weight: 700;
  }
  .footer-note {
    max-width: 840px;
    margin: 16px auto 0;
    background: rgba(255,255,255,0.7);
    padding: 10px 12px;
    font-size: 14px;
    line-height: 1.45;
  }
  @media (min-width: 760px) {
    .facts {
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
  }
</style>
</head>
<body>
<div class="app">
  <div class="frame">

    <section id="screen-home" class="screen">
      <div class="hero-center">
        <div class="eyebrow" id="homeTop">Einladung zum</div>
        <img class="headline-img" src="data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA[...]" alt="headline">
        <div class="place" id="homePlace">Tischtennisturnier</div>
        <div class="subline" id="homeBottom">und Nachbarschaftsgrillen</div>
        <div class="pick-text" id="pickText">Sprache auswählen</div>
        <div class="buttons" id="languageButtons"></div>
      </div>
    </section>

    <section id="screen-detail" class="screen hidden">
      <div class="topbar">
        <button class="back-btn" id="backButton">← Sprachen</button>
        <div class="select-wrap">
          <select id="languageSelect" aria-label="Sprache wählen"></select>
        </div>
      </div>

      <div class="detail-hero">
        <div class="eyebrow" id="detailTop">Einladung zum</div>
        <img class="headline-img" src="data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA[...]" alt="headline">
        <div class="place" id="detailPlace">Tischtennisturnier</div>
        <div class="subline" id="detailBottom">und Nachbarschaftsgrillen</div>
      </div>

      <div class="panel">
        <p class="intro" id="intro"></p>
        <div class="copy" id="contentCopy"></div>
      </div>

      <div class="strip" id="stripText"></div>
      <img class="symbols" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABwgAAAH0CAYAAAApE3neAAAQAElEQVR4AeydCdxV097H/8twDdeQOTKUeZbKUKYioUgSMqVkyBAhlCFlykxS5iFyTZkyNVGJMgslQyhTuCIz97ret+/OqfPsZ+[...]" alt="symbols">

      <div class="facts">
        <div class="fact" id="dateValue"></div>
        <div class="fact" id="timeValue"></div>
        <div class="fact" id="locationValue"></div>
      </div>

  </div>
</div>

<script>
const headerTexts = {
  homeTop: "Einladung zum",
  homePlace: "Tischtennisturnier",
  homeBottom: "und Nachbarschaftsgrillen",
  detailTop: "Einladung zum",
  detailPlace: "Tischtennisturnier",
  detailBottom: "und Nachbarschaftsgrillen"
};
  
const translations = {
  de: {
    label: "Deutsch",
    homeTop: "Einladung zum",
    homePlace: "Tischtennisturnier",
    homeBottom: "und Nachbarschaftsgrillen",
    pickText: "Sprache auswählen",
    backText: "← Sprachen",
    detailTop: "Einladung zum",
    detailPlace: "Tischtennisturnier",
    detailBottom: "und Nachbarschaftsgrillen",
    intro: "Kommt vorbei: Tischtennisturnier und Nachbarschaftsgrillen am 10.5. im Sodensternpark von 14-18 Uhr.",
    paragraphs: [
      "Liebe Nachbarschaft,",
      "Wir sind Bewohnerinnen und Bewohner von der Weserspitze. Wir möchten unsere Nachbarschaft besser kennenlernen.",
      "Deshalb laden wir euch herzlich ein, am 09.08. ab 13 Uhr zum Park in der Sodensternstraße zu kommen. Dort findet unter anderem ein Tischtennistunier statt, bei dem es tolle Preise zu gewinnen gibt! Außerdem wollen wir Grillen. Das ganze ist als Mitbringbuffet gedacht, bringt also gerne etwas leckeres zu Essen mit. Für einen besseren Überblick könnt ihr hier eintragen, was ihr für das Buffet mitbringt: pad.riseup.net/p/GrillenWeserspitze",
      "Wir freuen uns auf einen tollen gemeinsamen Nachmittag! Alle sind willkommen!",
      "Alle aus der Nachbarschaft sind willkommen — ob mit Schläger oder Grillbesteck.",
      "Tischtennisturnier: Anmeldung vor Ort ab 14:00, Spielbeginn 15:00. Einzel- und Doppelspiele, Teilnahme kostenfrei.",
      "Nachbarschaftsgrillen: Bringt Grillgut zum Teilen mit. Teller und Besteck gerne mitbringen; Getränke werden bereitgestellt.",
      "Wir freuen uns über Hilfe beim Aufbau und über Kuchenspenden für das gemeinsame Buffet.",
      "Bis bald im Sodensternpark!"
    ],
    stripText: "Tischtennis, Grillen, Musik und mehr!",
    dateValue: "09.08.",
    timeValue: "ab 13 Uhr",
    locationValue: "Sodensternpark",
    footerNote: "Infos zu Barrierefreiheit, Toiletten und Kinderbetreuung folgen hier später."
  },
  en: {
    label: "English",
    pickText: "Choose your language",
    backText: "← Languages",
    intro: "Join us for a table tennis tournament and neighbourhood barbecue on 10 May at Sodensternpark from 2–6pm.",
    paragraphs: [
      "Everyone from the neighbourhood is welcome — bring a paddle or something for the grill.",
      "Table tennis tournament: register on-site from 2pm, matches start at 3pm. Singles and doubles; free participation.",
      "Neighbourhood barbecue: bring food to share. Please bring plates and cutlery; drinks will be provided.",
      "We appreciate help with setup and cake donations for the buffet.",
      "See you at Sodensternpark!"
    ],
    stripText: "Table tennis, barbecue, music and more!",
    dateValue: "10.05.",
    timeValue: "2:00-6:00 pm",
    locationValue: "Sodensternpark",
    footerNote: "Accessibility, toilets and childcare info can be added here later."
  },
  // Fallback shorter entries for other languages; use German as default where not provided
  es: { label: "Español", pickText: "Elige tu idioma", backText: "← Idiomas", intro: "Invitación a torneo de ping-pong y barbacoa vecinal el 10 de mayo en Sodensternpark de 14:00 a 18:00.", paragraphs: ["Bienvenidos todos del barrio.", "Torneo: inscripciones en el lugar a las 14:00, inicio 15:00.", "Barbacoa: trae comida para compartir."], stripText: "¡Ping-pong, barbacoa y música!", dateValue: "10.05.", timeValue: "14:00-18:00", locationValue: "Sodensternpark", footerNote: "Más info próximamente." },
  fr: { label: "Français", pickText: "Choisissez votre langue", backText: "← Langues", intro: "Invitation au tournoi de tennis de table et barbecue de quartier le 10 mai au Sodensternpark de 14h à 18h.", paragraphs: ["Tout le quartier est le bienvenu.", "Tournoi: inscription sur place à 14h, début 15h.", "Barbecue: apportez de quoi partager."], stripText: "Tennis de table, barbecue et musique!", dateValue: "10.05.", timeValue: "14h00-18h00", locationValue: "Sodensternpark", footerNote: "Infos à venir." },
  tr: { label: "Türkçe", pickText: "Dilini seç", backText: "← Diller", intro: "10 Mayıs'ta Sodensternpark'ta masa tenisi turnuvası ve mahalle mangalına davetlisiniz (14:00-18:00).", paragraphs: ["Mahalleden herkesi bekliyoruz.", "Turnuva: yerinde kayıt 14:00, başlangıç 15:00.", "Mangal: paylaşmak için yiyecek getirin."], stripText: "Masa tenisi, mangal ve müzik!", dateValue: "10.05.", timeValue: "14:00-18:00", locationValue: "Sodensternpark", footerNote: "Daha fazla bilgi yakında eklenecek." },
  ar: { label: "العربية", pickText: "اختاروا اللغة", backText: "← اللغات", intro: "دعوة إلى بطولة تنس الطاولة وشواء الحي في 10 مايو في حديقة سودنستيرن من 14:00 إلى 18:00.", paragraphs: ["مرحب بجميع سكان الحي.", "البطولة: التسجيل في المكان من الساعة 14:00، البداية 15:00.", "الشواء: احضروا طعامًا للمشاركة."], stripText: "تنس طاولة، شواء، وموسيقى!", dateValue: "10.05.", timeValue: "14:00-18:00", locationValue: "Sodensternpark", footerNote: "معلومات إضافية ستضاف لاحقًا." },
  ru: { label: "Русский", pickText: "Выберите язык", backText: "← Языки", intro: "Приглашаем на турнир по настольному теннису и соседский барбекю 10 мая в Sodensternpark с 14:00 до 18:00.", paragraphs: ["Приглашаются все жители района.", "Турнир: регистрация на месте с 14:00, начало в 15:00.", "Барбекю: приносите еду для совместного стола."], stripText: "Теннис, барбекю и музыка!", dateValue: "10.05.", timeValue: "14:00-18:00", locationValue: "Sodensternpark", footerNote: "Дополнительная информация скоро." }
};

const tileInserts = {
  de: [
    "Tischtennisturnier: Preise für die Gewinner — bringt gute Laune mit!",
    "Grillen: Wer einen Grill hat, bitte kurz Bescheid geben. Helfende Hände sind willkommen."
  ],
  en: [
    "Tournament prizes for winners — bring your energy!",
    "Barbecue: If you have a grill, let us know. Helpers welcome."
  ]
};

const home = document.getElementById("screen-home");
const detail = document.getElementById("screen-detail");
const btnWrap = document.getElementById("languageButtons");
const select = document.getElementById("languageSelect");
const backButton = document.getElementById("backButton");

const homeEls = {
  top: document.getElementById("homeTop"),
  place: document.getElementById("homePlace"),
  bottom: document.getElementById("homeBottom"),
  pick: document.getElementById("pickText")
};
const detailEls = {
  top: document.getElementById("detailTop"),
  place: document.getElementById("detailPlace"),
  bottom: document.getElementById("detailBottom"),
  intro: document.getElementById("intro"),
  copy: document.getElementById("contentCopy"),
  strip: document.getElementById("stripText"),
  date: document.getElementById("dateValue"),
  time: document.getElementById("timeValue"),
  location: document.getElementById("locationValue"),
  footer: document.getElementById("footerNote")
};

function renderButtons() {
  btnWrap.innerHTML = "";
  select.innerHTML = "";
  Object.entries(translations).forEach(([lang, t]) => {
    const b = document.createElement("button");
    b.className = "lang-btn";
    b.textContent = t.label || lang;
    b.type = "button";
    b.addEventListener("click", () => openLanguage(lang));
    btnWrap.appendChild(b);

    const opt = document.createElement("option");
    opt.value = lang;
    opt.textContent = t.label || lang;
    select.appendChild(opt);
  });
}

function clearTileInserts() {
  const existing = detailEls.copy.querySelectorAll('.tile-insert');
  existing.forEach(el => el.remove());
}

function insertTileText(lang) {
  clearTileInserts();
  const inserts = tileInserts[lang] || tileInserts['de'];
  inserts.forEach(text => {
    const div = document.createElement('div');
    div.className = 'tile-insert';
    const p = document.createElement('p');
    p.textContent = text;
    div.appendChild(p);
    detailEls.copy.appendChild(div);
  });
}

function applyLanguage(lang) {
  const t = translations[lang] || translations.de;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

  homeEls.top.textContent = headerTexts.homeTop;
  homeEls.place.textContent = headerTexts.homePlace;
  homeEls.bottom.textContent = headerTexts.homeBottom;
  homeEls.pick.textContent = t.pickText || translations.de.pickText;

  detailEls.top.textContent = headerTexts.detailTop;
  detailEls.place.textContent = headerTexts.detailPlace;
  detailEls.bottom.textContent = headerTexts.detailBottom;
  detailEls.intro.textContent = t.intro || translations.de.intro;
  detailEls.strip.textContent = t.stripText || translations.de.stripText;
  detailEls.date.textContent = t.dateValue || translations.de.dateValue;
  detailEls.time.textContent = t.timeValue || translations.de.timeValue;
  detailEls.location.textContent = t.locationValue || translations.de.locationValue;
  backButton.textContent = t.backText || translations.de.backText;

  detailEls.copy.innerHTML = "";
  (t.paragraphs || translations.de.paragraphs).forEach(text => {
    const p = document.createElement("p");
    p.textContent = text;
    detailEls.copy.appendChild(p);
  });

  select.value = lang;
}

function openLanguage(lang) {
  applyLanguage(lang);
  // insert extra texts when a language tile is clicked
  insertTileText(lang);
  home.classList.add("hidden");
  detail.classList.remove("hidden");
  const params = new URLSearchParams(window.location.search);
  params.set("lang", lang);
  params.set("view", "detail");
  history.replaceState({}, "", `${window.location.pathname}?${params.toString()}`);
}

function goHome(lang = null) {
  if (lang) applyLanguage(lang);
  clearTileInserts();
  home.classList.remove("hidden");
  detail.classList.add("hidden");
  const params = new URLSearchParams(window.location.search);
  params.delete("view");
  if (lang) params.set("lang", lang);
  const q = params.toString();
  history.replaceState({}, "", q ? `${window.location.pathname}?${q}` : window.location.pathname);
}

renderButtons();

const params = new URLSearchParams(window.location.search);
const langFromUrl = params.get("lang");
const browserLang = (navigator.language || "de").slice(0,2).toLowerCase();
const initialLang = translations[langFromUrl] ? langFromUrl : (translations[browserLang] ? browserLang : "de");
applyLanguage(initialLang);

if (params.get("view") === "detail") {
  home.classList.add("hidden");
  detail.classList.remove("hidden");
  // if URL already requests detail, also show tile inserts
  insertTileText(initialLang);
}

select.addEventListener("change", (e) => openLanguage(e.target.value));
backButton.addEventListener("click", () => goHome(select.value));
</script>
</body>
</html>
