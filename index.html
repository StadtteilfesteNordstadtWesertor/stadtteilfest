<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feministisches Stadtteilfest Wesertor</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #e7b7d8;
    --pink-dark: #d89bc6;
    --ink: #111111;
    --white: rgba(255,255,255,0.9);
    --panel: rgba(255,255,255,0.86);
    --shadow: rgba(0,0,0,0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    color: var(--ink);
    background: #7e57c2; /* simple purple background */
  }
  .app {
    min-height: 100vh;
    background-color: #7e57c2; /* simple purple background */
    padding: 10px;
  }
  .frame {
    min-height: calc(100vh - 20px);
    border: 6px solid rgba(255,255,255,0.85);
    position: relative;
    overflow: hidden;
  }
  .screen {
    min-height: calc(100vh - 32px);
    padding: 18px 14px 24px;
  }
  .hidden { display: none; }

  .hero-center {
    min-height: calc(100vh - 68px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 14px;
    padding: 12px;
  }
  .eyebrow {
    font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
    letter-spacing: 0.35em;
    font-size: clamp(20px, 4.5vw, 32px);
    line-height: 1.1;
    font-weight: 700;
    text-align: center;
    color: var(--white);
  }
  .place {
    font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.28em;
    font-size: clamp(22px, 6vw, 44px);
    line-height: 1;
    color: var(--pink);
    text-shadow:
      -2px -2px 0 #000,
      2px -2px 0 #000,
      -2px 2px 0 #000,
      2px 2px 0 #000,
      0 5px 0 #000;
  }
  .subline {
    font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
    letter-spacing: 0.18em;
    font-size: clamp(16px, 3.6vw, 24px);
    line-height: 1.2;
    margin-bottom: 8px;
    color: var(--white);
  }
  .pick-text {
    font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
    font-size: clamp(16px, 3.8vw, 22px);
    line-height: 1.25;
    background: rgba(255,255,255,0.9);
    padding: 10px 16px;
    border-radius: 18px;
  }
  .buttons {
    width: min(100%, 440px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 4px;
  }
  .lang-btn {
    border: 0;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--pink) 0%, var(--pink-dark) 100%);
    color: #111;
    padding: 14px 12px;
    font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
    font-size: 18px;
    font-weight: 700;
    box-shadow: 0 8px 18px var(--shadow);
    cursor: pointer;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .back-btn, .select-wrap select {
    border: 0;
    border-radius: 999px;
    background: rgba(255,255,255,0.92);
    color: #111;
    padding: 11px 14px;
    font-size: 16px;
    font-weight: 700;
    box-shadow: 0 5px 14px rgba(0,0,0,0.08);
  }
  .back-btn { cursor: pointer; }
  .select-wrap select { appearance: none; }

  .panel {
    max-width: 840px;
    margin: 14px auto 18px;
    background: var(--panel);
    padding: 16px 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.05);
  }
  .intro { font-family: 'Patrick Hand', cursive; font-size: clamp(18px,4vw,26px); margin: 0 0 10px; }
  .copy { font-family: 'Patrick Hand', cursive; font-size: clamp(18px,3.8vw,24px); line-height: 1.35; }
  [dir="rtl"] .copy, [dir="rtl"] .intro, [dir="rtl"] .fact, [dir="rtl"] button { font-family: 'Noto Naskh Arabic', serif; }
  [dir="rtl"] .copy, [dir="rtl"] .intro { text-align: right; }
  .copy p { margin: 0 0 10px; }

  .facts { max-width: 860px; margin: 12px auto 0; display: grid; grid-template-columns: 1fr; gap: 4px; }
  .fact { text-align: center; font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive; font-size: clamp(18px,3.8vw,26px); line-height: 1.15; letter-spacing: 0.14em; font-weight: 700; }
  .footer-note { max-width: 840px; margin: 16px auto 0; background: rgba(255,255,255,0.7); padding: 10px 12px; font-size: 14px; line-height: 1.45; }
</style>
</head>
<body>
<div class="app">
  <div class="frame">

    <section id="screen-home" class="screen">
      <div class="hero-center">
        <div class="eyebrow" id="homeTop">Tischtennistunier und Nachbarschaftsgrillen</div>
        <div class="place" id="homePlace">wesertor</div>
        <div class="subline" id="homeBottom">für Frauen, Kinder und Queers</div>
        <div class="pick-text" id="pickText">Sprache auswählen</div>
        <div class="buttons" id="languageButtons"></div>
      </div>
    </section>

    <section id="screen-detail" class="screen hidden">
      <div class="topbar">
        <button class="back-btn" id="backButton">← Sprachen</button>
        <div class="select-wrap"><select id="languageSelect" aria-label="Sprache wählen"></select></div>
      </div>

      <div class="detail-hero">
        <div class="eyebrow" id="detailTop">Tischtennistunier und Nachbarschaftsgrillen</div>
        <div class="place" id="detailPlace">wesertor</div>
        <div class="subline" id="detailBottom">für Frauen, Kinder und Queers</div>
      </div>

      <div class="panel">
        <p class="intro" id="intro"></p>
        <div class="copy" id="contentCopy"></div>
      </div>

      <div class="facts">
        <div class="fact" id="dateValue"></div>
        <div class="fact" id="timeValue"></div>
        <div class="fact" id="locationValue"></div>
      </div>

  </div>
</div>

<script>
const headerTexts = {
  homeTop: "Tischtennistunier und Nachbarschaftsgrillen",
  homePlace: "Sodensternpark",
  homeBottom: "",
  detailTop: "Tischtennistunier und Nachbarschaftsgrillen",
  detailPlace: "",
  detailBottom: ""
};

const translations = {
  de: {
    label: "Deutsch",
    homeTop: "Tischtennistunier und Nachbarschaftsgrillen",
    homePlace: "Sodensternpark",
    homeBottom: "für Frauen, Kinder und Queers",
    pickText: "Sprache auswählen",
    backText: "← Sprachen",
    detailTop: "Tischtennistunier und Nachbarschaftsgrillen",
    detailPlace: "wesertor",
    detailBottom: "für Frauen, Kinder und Queers",
    intro: "Liebe Nachbarschaft,",
    paragraphs: [
      "wir sind Bewohnerinnen und Bewohner von der Weserspitze. Wir möchten unsere Nachbarschaft besser kennenlernen.",
      "Deshalb laden wir euch herzlich ein, am 09.08. ab 13 Uhr zum Park in der Sodensternstraße zu kommen. Dort findet unter anderem ein Tischtennistunier statt, bei dem es tolle Preise zu gewinnen gibt! Außerdem wollen wir Grillen. Das ganze ist als Mitbringbuffet gedacht, bringt also gerne etwas leckeres zu Essen mit.",
      "Für einen besseren Überblick könnt ihr hier eintragen, was ihr für das Buffet mitbringt: <a href=\"https://pad.riseup.net/p/GrillenWeserspitze\" target=\"_blank\" rel=\"noopener\">pad.riseup.net/p/GrillenWeserspitze</a>",
      "Wir freuen uns auf einen tollen gemeinsamen Nachmittag! Alle sind willkommen!"
    ],
    stripText: "",
    dateValue: "09.08.",
    timeValue: "13:00",
    locationValue: "Sodensternstraße Park",
    footerNote: ""
  },
  en: {
    label: "English",
    homeTop: "Tischtennistunier und Nachbarschaftsgrillen",
    homePlace: "Sodensternpark",
    homeBottom: "for women, kids and queers",
    pickText: "Choose your language",
    backText: "← Languages",
    detailTop: "Tischtennistunier und Nachbarschaftsgrillen",
    detailPlace: "wesertor",
    detailBottom: "for women, kids and queers",
    intro: "Dear neighbours,",
    paragraphs: [
      "We are residents of Weserspitze. We’d like to get to know our neighbourhood better.",
      "That’s why we’d like to warmly invite you to come to the park on Sodensternstraße on 9 August from 1 pm. Among other things, there’ll be a table tennis tournament with great prizes to be won! We’re also planning a barbecue. It’s intended to be a potluck, so please do bring along something tasty to eat.",
      "To give us a better idea of what’s on offer, you can list what you’re bringing to the buffet here: <a href=\"https://pad.riseup.net/p/GrillenWeserspitze\" target=\"_blank\" rel=\"noopener\">pad.riseup.net/p/GrillenWeserspitze</a>",
      "We’re looking forward to a lovely afternoon together! Everyone is welcome!"
    ],
    stripText: "",
    dateValue: "09.08.",
    timeValue: "13:00",
    locationValue: "Sodensternstraße Park",
    footerNote: ""
  },
  es: {
    label: "Español",
    homeTop: "",

    homeBottom: "",

    intro: "",

    stripText: "",

    locationValue: "",
    footerNote: ""
  },
  fr: {
    label: "Français",
    homeTop: "",

    homeBottom: "",
    pickText: "",
    backText: "",
    detailTop: "",
    detailPlace: "",
    detailBottom: "",
    intro: "",
    paragraphs: [],
    stripText: "",
    dateValue: "",
    timeValue: "",
    locationValue: "",
    footerNote: ""
  },
  tr: {
    label: "Türkçe",
    homeTop: "",
    homePlace: "",
    homeBottom: "",
    pickText: "",
    backText: "",
    detailTop: "",
    detailPlace: "",
    detailBottom: "",
    intro: "",
    paragraphs: [],
    stripText: "",
    dateValue: "",
    timeValue: "",
    locationValue: "",
    footerNote: ""
  },
  ar: {
    label: "العربية",
    homeTop: "مهرجان نسوي",
    homePlace: "Sodensternpark",
    homeBottom: "للنساء والأطفال ومجتمع الميم",
    pickText: "اختاروا اللغة",
    backText: "← اللغات",
    detailTop: "مهرجان نسوي",
    detailPlace: "فيسرتور",
    detailBottom: "للنساء والأطفال ومجتمع الميم",
    intro: "دعوة إلى بطولة تنس الطاولة وحفل شواء للجيران",
    paragraphs: [
      "أعزاءنا الجيران،",
      "نحن مجموعة من سكان Weserspitze، ونرغب في التعرّف إلى جيراننا بشكل أفضل.",
      "لذلك يسعدنا دعوتكم يوم 09.08 ابتداءً من الساعة 13:00 للحضور إلى الحديقة الموجودة في Sodensternstraße.",
      "ستُقام هناك، إلى جانب أنشطة أخرى، بطولة لتنس الطاولة، ويمكنكم الفوز بجوائز رائعة! كما سنقيم أيضًا حفل شواء.",
      "سيكون الطعام على شكل بوفيه يشارك فيه الجميع، لذلك يمكنكم إحضار شيء لذيذ للأكل والمشاركة به. ولمعرفة ما سيحضره كل شخص إلى البوفيه وتنظيم الأمر بشكل أفضل، يمكنكم تسجيل ما ستجلبونه عبر الرابط التالي: <a href=\"https://pad.riseup.net/p/GrillenWeserspitze\" target=\"_blank\" rel=\"noopener\">pad.riseup.net/p/GrillenWeserspitze</a>",
      "نتطلع إلى قضاء فترة بعد ظهر جميلة وممتعة معًا!",
      "الجميع مرحّب بهم!"
    ],
    stripText: "",
    dateValue: "09.08.",
    timeValue: "13:00",
    locationValue: "حديقة Sodensternstraße",
    footerNote: ""
  },
  ru: {
    label: "Русский",
    homeTop: "",
    homePlace: "",
    homeBottom: "",
    pickText: "",
    backText: "",
    detailTop: "",
    detailPlace: "",
    detailBottom: "",
    intro: "",
    paragraphs: [],
    stripText: "",
    dateValue: "",
    timeValue: "",
    locationValue: "",
    footerNote: ""
  }
};

const home = document.getElementById("screen-home");
const detail = document.getElementById("screen-detail");
const btnWrap = document.getElementById("languageButtons");
const select = document.getElementById("languageSelect");
const backButton = document.getElementById("backButton");

const homeEls = {
  top: document.getElementById("homeTop"),
  place: document.getElementById("homePlace"),
  bottom: document.getElementById("homeBottom"),
  pick: document.getElementById("pickText")
};
const detailEls = {
  top: document.getElementById("detailTop"),
  place: document.getElementById("detailPlace"),
  bottom: document.getElementById("detailBottom"),
  intro: document.getElementById("intro"),
  copy: document.getElementById("contentCopy"),
  date: document.getElementById("dateValue"),
  time: document.getElementById("timeValue"),
  location: document.getElementById("locationValue")
};

function renderButtons() {
  btnWrap.innerHTML = "";
  select.innerHTML = "";
  Object.entries(translations).forEach(([lang, t]) => {
    const b = document.createElement("button");
    b.className = "lang-btn";
    b.textContent = t.label || lang;
    b.type = "button";
    b.addEventListener("click", () => openLanguage(lang));
    btnWrap.appendChild(b);

    const opt = document.createElement("option");
    opt.value = lang;
    opt.textContent = t.label || lang;
    select.appendChild(opt);
  });
}

function applyLanguage(lang) {
  const t = translations[lang] || translations.de;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

  homeEls.top.textContent = headerTexts.homeTop;
  homeEls.place.textContent = headerTexts.homePlace;
  homeEls.bottom.textContent = headerTexts.homeBottom;
  homeEls.pick.textContent = t.pickText || "";

  detailEls.top.textContent = headerTexts.detailTop;
  detailEls.place.textContent = headerTexts.detailPlace;
  detailEls.bottom.textContent = headerTexts.detailBottom;
  detailEls.intro.textContent = t.intro || "";
  detailEls.date.textContent = t.dateValue || "";
  detailEls.time.textContent = t.timeValue || "";
  detailEls.location.textContent = t.locationValue || "";

  detailEls.copy.innerHTML = "";
  (t.paragraphs || []).forEach(text => {
    const p = document.createElement("p");
    p.innerHTML = text;
    detailEls.copy.appendChild(p);
  });

  select.value = lang;
}

function openLanguage(lang) {
  applyLanguage(lang);
  home.classList.add("hidden");
  detail.classList.remove("hidden");
  const params = new URLSearchParams(window.location.search);
  params.set("lang", lang);
  params.set("view", "detail");
  history.replaceState({}, "", `${window.location.pathname}?${params.toString()}`);
}

function goHome(lang = null) {
  if (lang) applyLanguage(lang);
  home.classList.remove("hidden");
  detail.classList.add("hidden");
  const params = new URLSearchParams(window.location.search);
  params.delete("view");
  if (lang) params.set("lang", lang);
  const q = params.toString();
  history.replaceState({}, "", q ? `${window.location.pathname}?${q}` : window.location.pathname);
}

renderButtons();

const params = new URLSearchParams(window.location.search);
const langFromUrl = params.get("lang");
const browserLang = (navigator.language || "de").slice(0,2).toLowerCase();
const initialLang = translations[langFromUrl] ? langFromUrl : (translations[browserLang] ? browserLang : "de");
applyLanguage(initialLang);

if (params.get("view") === "detail") { home.classList.add("hidden"); detail.classList.remove("hidden"); }

select.addEventListener("change", (e) => openLanguage(e.target.value));
backButton.addEventListener("click", () => goHome(select.value));
</script>
</body>
</html>
